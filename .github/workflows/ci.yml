name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Frontend build
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tauri integration build
        # npm 11 needs the second separator to forward options to the Tauri CLI.
        run: npm run desktop:build -- -- --no-bundle --ci

  msrv:
    name: Rust 1.88 minimum
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - name: Check the locked dependency graph on the declared MSRV
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  rustsec:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  desktop-bundle:
    name: Manual Windows desktop bundle
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, msrv, rustsec]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run desktop:build

      - uses: actions/upload-artifact@v6
        with:
          name: prime-orbit-windows-bundle
          path: src-tauri/target/release/bundle
          if-no-files-found: error
