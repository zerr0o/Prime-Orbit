name: Signed Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: prime-orbit-release
  cancel-in-progress: false

jobs:
  release-windows:
    name: Validate and prepare signed Windows draft
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.12.0
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-20
        with:
          components: clippy, rustfmt

      - name: Verify tag and manifest versions
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Load versioned release notes
        id: release_notes
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $notesPath = Join-Path $env:GITHUB_WORKSPACE "docs/releases/v$version.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Missing release notes: docs/releases/v$version.md"
          }

          $notes = (Get-Content -Raw -LiteralPath $notesPath).TrimEnd()
          if ([string]::IsNullOrWhiteSpace($notes)) {
            throw "Release notes must not be empty: docs/releases/v$version.md"
          }

          $delimiter = "PRIME_ORBIT_RELEASE_NOTES_$([Guid]::NewGuid().ToString('N'))"
          $output = "body<<$delimiter`n$notes`n$delimiter`n"
          [System.IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            $output,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Verify tagged commit belongs to main
        shell: pwsh
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The release tag must point to a commit reachable from main."
          }

      - name: Require updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY. Refusing to create unsigned updater artifacts."
          }

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Frontend build
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Install declared Rust minimum
        shell: pwsh
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Rust 1.88 minimum check
        run: cargo +1.88.0 check --locked --manifest-path src-tauri/Cargo.toml

      - name: Refuse release tag reuse
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $response = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect existing GitHub releases for $env:GITHUB_REF_NAME."
          }

          $existing = @(
            ($response | ConvertFrom-Json) |
              Where-Object { $_.tag_name -ceq $env:GITHUB_REF_NAME }
          )
          if ($existing.Count -gt 0) {
            $published = @($existing | Where-Object { -not $_.draft })
            if ($published.Count -gt 0) {
              throw "Published release $env:GITHUB_REF_NAME already exists. Published release assets are immutable; bump the version and create a new tag."
            }

            throw "Draft release $env:GITHUB_REF_NAME already exists. Review and delete the stale draft before rerunning so no prior body or partial assets can be reused."
          }

      - name: Build signed updater artifacts and create draft release
        id: tauri_release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Prime Orbit v__VERSION__
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json --ci
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2

      - name: Generate and upload installer checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri_release.outputs.releaseId }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_ID)) {
            throw "tauri-action did not return a release id."
          }

          # GitHub's get-by-tag endpoint does not return draft releases. Resolve
          # the exact release id produced by tauri-action instead.
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if (
            [string]$release.id -ne [string]$env:RELEASE_ID -or
            -not $release.draft -or
            $release.tag_name -cne $env:GITHUB_REF_NAME
          ) {
            throw "Refusing to upload checksums outside the draft created by this workflow."
          }

          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/bundle"
          $nsisInstallers = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot "nsis") -Filter "*.exe" -File)
          $msiInstallers = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot "msi") -Filter "*.msi" -File)
          if ($nsisInstallers.Count -ne 1 -or $msiInstallers.Count -ne 1) {
            throw "Expected exactly one NSIS installer and one MSI installer; found $($nsisInstallers.Count) EXE and $($msiInstallers.Count) MSI."
          }

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "latest.json"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "tauri-action did not generate latest.json in the workspace."
          }
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json

          # GitHub may normalize an uploaded filename (for example spaces to
          # dots). latest.json contains the canonical API URL, so use that URL
          # to recover the public asset name instead of comparing local names.
          function Resolve-UpdaterAsset([string]$target, [string]$extension) {
            $entry = $manifest.platforms.PSObject.Properties[$target].Value
            if ($null -eq $entry -or [string]::IsNullOrWhiteSpace($entry.url)) {
              throw "latest.json is missing the URL for '$target'."
            }

            $matches = @(
              $release.assets |
                Where-Object { ([string]$_.url) -ceq ([string]$entry.url) }
            )
            if ($matches.Count -ne 1) {
              throw "Updater target '$target' URL does not match exactly one GitHub release asset API URL."
            }
            if (-not ([string]$matches[0].name).EndsWith($extension, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Updater target '$target' resolved to unexpected asset '$($matches[0].name)'."
            }
            return $matches[0]
          }

          $checksumSources = @(
            [pscustomobject]@{
              Local = $nsisInstallers[0]
              Asset = (Resolve-UpdaterAsset "windows-x86_64-nsis" ".exe")
            },
            [pscustomobject]@{
              Local = $msiInstallers[0]
              Asset = (Resolve-UpdaterAsset "windows-x86_64-msi" ".msi")
            }
          )

          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $checksumPath = Join-Path $env:GITHUB_WORKSPACE "SHA256SUMS-v$version.txt"
          $checksumLines = $checksumSources |
            Sort-Object { $_.Asset.name } |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.Local.FullName -Algorithm SHA256).Hash
              $expectedDigest = "sha256:$($hash.ToLowerInvariant())"
              if ([int64]$_.Asset.size -ne [int64]$_.Local.Length -or ([string]$_.Asset.digest) -cne $expectedDigest) {
                throw "GitHub asset '$($_.Asset.name)' does not match the locally built bytes for its updater platform."
              }
              "$hash  $($_.Asset.name)"
            }
          $checksumLines | Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM

          $checksumName = [System.IO.Path]::GetFileName($checksumPath)
          $encodedChecksumName = [Uri]::EscapeDataString($checksumName)
          $checksumFile = Get-Item -LiteralPath $checksumPath
          $checksumHash = (Get-FileHash -LiteralPath $checksumPath -Algorithm SHA256).Hash
          $checksumDigest = "sha256:$($checksumHash.ToLowerInvariant())"
          $uploaded = $false
          for ($attempt = 1; $attempt -le 3 -and -not $uploaded; $attempt += 1) {
            # An upload can reach GitHub even when the client loses the final
            # response. Check the draft before every retry to avoid duplicate
            # assets and accept only the exact bytes generated by this run.
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) {
              if ($attempt -eq 3) {
                throw "Unable to verify draft $env:RELEASE_ID before uploading $checksumName."
              }
              Start-Sleep -Seconds ([Math]::Pow(2, $attempt))
              continue
            }
            $existingChecksums = @(
              $release.assets |
                Where-Object { ([string]$_.name) -ceq $checksumName }
            )
            if ($existingChecksums.Count -gt 1) {
              throw "Draft $env:RELEASE_ID contains duplicate $checksumName assets."
            }
            if ($existingChecksums.Count -eq 1) {
              if (
                [int64]$existingChecksums[0].size -ne [int64]$checksumFile.Length -or
                ([string]$existingChecksums[0].digest) -cne $checksumDigest
              ) {
                throw "Existing draft asset $checksumName does not match this build."
              }
              $uploaded = $true
              break
            }

            try {
              # `gh api --hostname uploads.github.com` incorrectly targets
              # api.uploads.github.com. Use GitHub's dedicated upload endpoint
              # directly while keeping the token masked in the environment.
              $uploadHeaders = @{
                Authorization = "Bearer $env:GH_TOKEN"
                Accept = "application/vnd.github+json"
                "X-GitHub-Api-Version" = "2022-11-28"
              }
              $uploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=$encodedChecksumName"
              $null = Invoke-RestMethod `
                -Uri $uploadUrl `
                -Method Post `
                -Headers $uploadHeaders `
                -ContentType "application/octet-stream" `
                -InFile $checksumPath
              $uploaded = $true
              break
            } catch {
              Write-Warning "Checksum upload attempt $attempt failed: $($_.Exception.Message)"
            }
            if ($attempt -lt 3) {
              Start-Sleep -Seconds ([Math]::Pow(2, $attempt))
            }
          }
          $verifiedChecksum = $false
          for ($verifyAttempt = 1; $verifyAttempt -le 3 -and -not $verifiedChecksum; $verifyAttempt += 1) {
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
            if ($LASTEXITCODE -eq 0) {
              $uploadedChecksums = @(
                $release.assets |
                  Where-Object { ([string]$_.name) -ceq $checksumName }
              )
              if ($uploadedChecksums.Count -gt 1) {
                throw "Draft $env:RELEASE_ID contains duplicate $checksumName assets."
              }
              if ($uploadedChecksums.Count -eq 1) {
                if (
                  [int64]$uploadedChecksums[0].size -ne [int64]$checksumFile.Length -or
                  ([string]$uploadedChecksums[0].digest) -cne $checksumDigest
                ) {
                  throw "Uploaded draft asset $checksumName does not match this build."
                }
                $verifiedChecksum = $true
                break
              }
            }
            if ($verifyAttempt -lt 3) {
              Start-Sleep -Seconds ([Math]::Pow(2, $verifyAttempt))
            }
          }
          if (-not $verifiedChecksum) {
            throw "Failed to upload and verify $checksumName for draft release $env:RELEASE_ID after 3 attempts."
          }

      - name: Verify draft updater release is complete
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri_release.outputs.releaseId }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_ID)) {
            throw "tauri-action did not return a release id."
          }

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if (-not $release.draft) {
            throw "The release is not a draft; refusing to accept an automatically published release."
          }

          $expectedVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $expectedTag = "v$expectedVersion"
          if ($release.tag_name -ne $expectedTag) {
            throw "Draft release tag '$($release.tag_name)' does not match '$expectedTag'."
          }

          function Normalize-ReleaseNotes([string]$value) {
            return $value.Replace("`r`n", "`n").TrimEnd()
          }

          $notesPath = Join-Path $env:GITHUB_WORKSPACE "docs/releases/v$expectedVersion.md"
          $expectedNotes = Normalize-ReleaseNotes (Get-Content -Raw -LiteralPath $notesPath)
          if ((Normalize-ReleaseNotes ([string]$release.body)) -ne $expectedNotes) {
            throw "The GitHub draft body does not match docs/releases/v$expectedVersion.md."
          }

          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $requiredPatterns = @(
            "latest.json",
            "*.exe",
            "*.exe.sig",
            "*.msi",
            "*.msi.sig",
            "SHA256SUMS-v$expectedVersion.txt"
          )
          foreach ($pattern in $requiredPatterns) {
            if (-not ($assetNames | Where-Object { $_ -like $pattern })) {
              throw "Draft release is missing required asset pattern '$pattern'. Assets: $($assetNames -join ', ')"
            }
          }

          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "latest.json"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "tauri-action did not generate latest.json in the workspace."
          }

          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ($manifest.version -ne $expectedVersion) {
            throw "latest.json version '$($manifest.version)' does not match '$expectedVersion'."
          }
          if ((Normalize-ReleaseNotes ([string]$manifest.notes)) -ne $expectedNotes) {
            throw "latest.json notes do not match docs/releases/v$expectedVersion.md."
          }

          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/bundle"
          $targets = @("windows-x86_64", "windows-x86_64-nsis", "windows-x86_64-msi")
          $verifiedArtifacts = @{}
          foreach ($target in $targets) {
            $entry = $manifest.platforms.PSObject.Properties[$target].Value
            if ($null -eq $entry -or [string]::IsNullOrWhiteSpace($entry.url) -or [string]::IsNullOrWhiteSpace($entry.signature)) {
              throw "latest.json is missing a complete '$target' updater entry."
            }

            $artifactAssets = @(
              $release.assets |
                Where-Object { ([string]$_.url) -ceq ([string]$entry.url) }
            )
            if ($artifactAssets.Count -ne 1) {
              throw "Updater target '$target' URL does not match exactly one GitHub release asset API URL."
            }

            $artifactName = [string]$artifactAssets[0].name
            $signatureName = "$artifactName.sig"
            $signatureAssets = @(
              $release.assets |
                Where-Object { ([string]$_.name) -ceq $signatureName }
            )
            if ($signatureAssets.Count -ne 1) {
              throw "Updater target '$target' does not resolve to an uploaded artifact and signature."
            }

            $isMsi = $target -eq "windows-x86_64-msi"
            $bundleKind = if ($isMsi) { "msi" } else { "nsis" }
            $artifactPattern = if ($isMsi) { "*.msi" } else { "*.exe" }
            $localArtifacts = @(
              Get-ChildItem -LiteralPath (Join-Path $bundleRoot $bundleKind) -Filter $artifactPattern -File
            )
            if ($localArtifacts.Count -ne 1) {
              throw "Expected one local updater artifact for '$target'; found $($localArtifacts.Count)."
            }

            $localSignaturePath = "$($localArtifacts[0].FullName).sig"
            if (-not (Test-Path -LiteralPath $localSignaturePath -PathType Leaf)) {
              throw "Expected a local signature beside the '$target' updater artifact."
            }

            $artifactHash = (Get-FileHash -LiteralPath $localArtifacts[0].FullName -Algorithm SHA256).Hash
            $artifactDigest = "sha256:$($artifactHash.ToLowerInvariant())"
            if (
              [int64]$artifactAssets[0].size -ne [int64]$localArtifacts[0].Length -or
              ([string]$artifactAssets[0].digest) -cne $artifactDigest
            ) {
              throw "Uploaded updater artifact '$artifactName' does not match the locally built '$target' bytes."
            }

            $localSignatureFile = Get-Item -LiteralPath $localSignaturePath
            $signatureHash = (Get-FileHash -LiteralPath $localSignaturePath -Algorithm SHA256).Hash
            $signatureDigest = "sha256:$($signatureHash.ToLowerInvariant())"
            if (
              [int64]$signatureAssets[0].size -ne [int64]$localSignatureFile.Length -or
              ([string]$signatureAssets[0].digest) -cne $signatureDigest
            ) {
              throw "Uploaded signature '$signatureName' does not match the locally generated '$target' signature."
            }

            $localSignature = (Get-Content -Raw -LiteralPath $localSignaturePath).Trim()
            if ($localSignature -ne ([string]$entry.signature).Trim()) {
              throw "latest.json signature does not match the generated signature for '$target'."
            }

            if (-not $verifiedArtifacts.ContainsKey($artifactName)) {
              $env:PRIME_ORBIT_UPDATER_ARTIFACT = $localArtifacts[0].FullName
              $env:PRIME_ORBIT_UPDATER_SIGNATURE = $localSignaturePath
              cargo test --locked --manifest-path src-tauri/Cargo.toml --test updater_signature -- --ignored --exact embedded_public_key_verifies_release_artifact
              if ($LASTEXITCODE -ne 0) {
                throw "The updater artifact for '$target' is not signed by the public key embedded in Prime Orbit."
              }
              $verifiedArtifacts[$artifactName] = $true
            }
          }
          Remove-Item Env:PRIME_ORBIT_UPDATER_ARTIFACT -ErrorAction SilentlyContinue
          Remove-Item Env:PRIME_ORBIT_UPDATER_SIGNATURE -ErrorAction SilentlyContinue

          $generic = $manifest.platforms.PSObject.Properties["windows-x86_64"].Value
          $nsis = $manifest.platforms.PSObject.Properties["windows-x86_64-nsis"].Value
          if ($generic.url -ne $nsis.url -or $generic.signature -ne $nsis.signature) {
            throw "The generic Windows updater target does not prefer NSIS as configured."
          }

          Write-Host "Verified draft release $($release.html_url) with updater metadata for $expectedVersion."
